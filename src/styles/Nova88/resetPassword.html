<!DOCTYPE html>
<html lang="en">
<head>
    <title>NOVA88</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

<body>
    <header class="header">
        <div class="title">RESET PASSWORD</div>
        <div class="close "><!--class="close open"-->
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="subMenu "></div>
    </header>
    <main class="main">
        <div class="inputBox">
            <i class="icon icon-key"></i>
            <input placeholder="New Password">
            <div class="icon-module">
                <i class="icon icon-eye"></i>
                <i class="icon icon-warning"></i>
            </div>
            <div class="LoginRule ">6-18 alphanumeric (A-Z, a-z, 0-9) characters or special characters @$*!%#?&</div>
        </div>
        <div class="btn-group">
            <button class="orange">Submit</button>
        </div>
    </main>
    <footer id="footer">
        <a class="open">
            <div class="circleAnimation">
                <div class="icon icon-home"></div>
            </div>
            <span>HOME</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-promotion"></div>
            </div>
            <span>PROMOTION</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-balance"></div>
            </div>
            <span>WALLET</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-contact"></div>
            </div>
            <span>LIVE CHAT</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-member"></div>
            </div>
            <span>MEMBER</span>
        </a>
    </footer>
