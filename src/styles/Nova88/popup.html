<!DOCTYPE html>
<html lang="en">
<head>
    <title>NOVA88</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css?v=202003">
    <link rel="stylesheet" href="css/style-dark.css?v=202003">
    <link rel="stylesheet" href="css/font.css?v=202003">    
    <link rel="stylesheet" href="css/swiper.css">
</head>
<body>
    <header class="header">
        <div class="title">Popup</div>
        <div class="close ">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="subMenu "></div>
    </header>
    <main class="main"></main>
    <footer id="footer">
        <a class="open">
            <div class="circleAnimation">
                <div class="icon icon-home"></div>
            </div>
            <span>HOME</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-promotion"></div>
            </div>
            <span>PROMOTION</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-balance"></div>
            </div>
            <span>WALLET</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-contact"></div>
            </div>
            <span>LIVE CHAT</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-member"></div>
            </div>
            <span>MEMBER</span>
        </a>
    </footer>
    <div id="popup">
        <div class="popTit">
            <div class="close open">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            重要資訊
        </div>
        <div class="popTxt">
            請確認存款資料
            <img src="http://www.n88dev.com/common/images/BankLogo/ACB.png">
            <span class="text-org">存款金額：</span>
            <span>33('000)</span>
        </div>
    </div>
    <div id="popup" style="display: block;">
        <div class="popTit">
            <div class="close open">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            重要資訊
        </div>
        <div class="popTxt">
            <div>
                <ul>
                    <li>提款至<span>Maybank Berhad</span></li>
                    <li>帳戶名稱<span>wenchung</span></li>
                    <li>銀行帳戶號碼<span>12345678</span></li>
                    <li>提款金額<span>100.00</span></li>
                </ul>
            </div>
            <div class="btn-group">
                <button class="blue">Cancel</button>
                <button class="orange openPopup">Submit</button>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/16.8.6/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/16.8.6/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.js"></script>
    <script src="js/demo.js"></script>
</body>
</html>
