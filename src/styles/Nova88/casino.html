<!DOCTYPE html>
<html lang="en">
<head>
    <title>NOVA88</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css?v=202003">
    <link rel="stylesheet" href="css/style-dark.css?v=202003">
    <link rel="stylesheet" href="css/font.css?v=202003">
    <link rel="stylesheet" href="css/swiper.css">
</head>
<body>
    <header class="header">
        <div class="title">Casino</div>
        <div class="close ">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="subMenu "></div>
    </header>
    <main class="main casino">
        <div class="slotBanner"><!--這邊直接copy首頁輪番banner-->
            <img src="img/slotbanner.jpg" class="banner" />
        </div>
        <div class="inputBox filterBtn">          
            <button class="open">All Game</button>
            <button>Feature</button>
            <button>Favourite</button>
            <button>Jackpot</button>
        </div>
        <div class="inputBox">
            <i class="icon icon-search"></i>
            <input class="search" placeholder="Search">            
            <button class="icon icon-equalizer filter"></button>
        </div>
        <div class="filterSelect">
            <div class="inputBox">
                <div class="dropdown ">
                    <button class="btn">
                        <span class="text">Game Platform</span>
                    </button>
                    <div class="dropdown-container">
                        <div class="dropdown-item">
                            <span class="text">JOKER</span>
                        </div>
                        <div class="dropdown-item">
                            <span class="text">YGG</span>
                        </div>
                        <div class="dropdown-item">
                            <span class="text">PP</span>
                        </div>
                        <div class="dropdown-item">
                            <span class="text">GPI</span>
                        </div>
                        <div class="dropdown-item">
                            <span class="text">SG</span>
                        </div>
                        <div class="dropdown-item">
                            <span class="text">PG</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="inputBox">
                <div class="dropdown ">
                    <button class="btn">
                        <span class="text">Game Type</span>
                    </button>
                    <div class="dropdown-container">
                        <div class="dropdown-item">
                            <span class="text">Slots</span>
                        </div>
                        <div class="dropdown-item">
                            <span class="text">Table</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slotList">
            <div class="info star">
                <img src="http://www.n88dev.com/common/images/Casino/YGG/Vikings-go-Berzerk-EN.jpg" />
                <span>Joker</span>
                <span class="icon icon-star-full"></span>
            </div>
            <div class="info">
                <button><img src="http://www.n88dev.com/common/images/Casino/YGG/Valley-of-the-Gods-EN.jpg" /></button>
                <span>YGG</span>
                <span class="icon icon-star-empty"></span>
            </div>
            <div class="info">
                <button><img src="http://www.n88dev.com/common/images/Casino/YGG/9K-Yeti-EN.jpg" /></button>
                <span>GPI</span>
                <span class="icon icon-star-empty"></span>
            </div>
            <div class="info">
                <button><img src="http://www.n88dev.com/common/images/Casino/YGG/Ice-and-Fire-EN.jpg" /></button>
                <span>SG</span>
                <span class="icon icon-star-empty"></span>
            </div>
            <div class="info">
                <button><img src="http://www.n88dev.com/common/images/Casino/YGG/Cazino-Cosmos-EN.jpg" /></button>
                <span>PP</span>
                <span class="icon icon-star-empty"></span>
            </div>
            <div class="info">
                <button><img src="http://www.n88dev.com/common/images/Casino/YGG/Jackpot-Raiders-EN.jpg" /></button>
                <span>PG</span>
                <span class="icon icon-star-empty"></span>
            </div>
            <div class="info">
                <button><img src="http://www.n88dev.com/common/images/Casino/YGG/Nikola-Teslas-Incredible-Machine-EN.jpg" /></button>
                <span>Joker</span>
                <span class="icon icon-star-empty"></span>
            </div>
        </div>
        <div class="slotFunction">
            <div class="title text-org">Vikings go Berzerk</div>
            <button class="icon icon-cancel-circle"></button>
            <div class="btn-group">
                <button class="white">FREE PLAY</button>
                <button class="orange">PLAY NOW</button>
            </div>
        </div>
    </main>
    <footer id="footer">
        <a class="open">
            <div class="circleAnimation">
                <div class="icon icon-home"></div>
            </div>
            <span>HOME</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-promotion"></div>
            </div>
            <span>PROMOTION</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-balance"></div>
            </div>
            <span>WALLET</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-contact"></div>
            </div>
            <span>LIVE CHAT</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-member"></div>
            </div>
            <span>MEMBER</span>
        </a>
    </footer>
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/16.8.6/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/16.8.6/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.js"></script>
    <script src="js/demo.js"></script>
</body>
</html>
