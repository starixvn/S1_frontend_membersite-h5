<!DOCTYPE html>
<html lang="en">
<head>
    <title>NOVA88</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css?v=202003">
    <link rel="stylesheet" href="css/style-dark.css?v=202003">
    <link rel="stylesheet" href="css/font.css?v=202003">
</head>
<body>
    <header class="header">
        <div class="title">Deposit</div>
        <div class="close "><!--class="close open"-->
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="subMenu "></div>
    </header>
    <main class="main">
        <div class="tag">
            <button class="open">Deposit</button>
            <button>Deposit History</button>
        </div>
        <div class="step">
            <div class="stepLine">
                <div class="stepBar100"></div>
            </div>
            <div class="circle">
                <div>
                    <div class="icon icon-checkmark"></div>
                </div>
            </div>
            <div class="circle">
                <div>
                    <div class="icon icon-checkmark"></div>
                </div>
            </div>
            <div class="circle">
                <div>
                    <div class="icon icon-checkmark"></div>
                </div>
            </div>
        </div>
        <div class="inputBox">
            <div class="account">
                <div class="bankLogo acb"></div>
                <div class="info">
                    <ul>
                        <li>
                            <span class="title">Zalo</span>
                            <div class="tip"><span class="text-org">Limt :</span> 30 ('000)~300,000 ('000)</div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <span class="infoStates">0 ('000)</span>
        <div class="buttonBox">
            <button class="open"><i class="icon icon-checkmark"></i>20 ('000)</button>
            <button><i class="icon icon-checkmark"></i>50 ('000)</button>
            <button><i class="icon icon-checkmark"></i>100 ('000)</button>
            <button><i class="icon icon-checkmark"></i>200 ('000)</button>
            <button><i class="icon icon-checkmark"></i>300 ('000)</button>
            <button><i class="icon icon-checkmark"></i>500 ('000)</button>
            <button><i class="icon icon-checkmark"></i>1,000 ('000)</button>
            <button><i class="icon icon-checkmark"></i>2,000 ('000)</button>
            <button><i class="icon icon-checkmark"></i>3,000 ('000)</button>
            <button><i class="icon icon-checkmark"></i>5,000 ('000)</button>
        </div>
        <div class="btn-group">
            <button class="white">Back</button>
            <button class="orange">Submit</button>
        </div>
    </main>
    <footer id="footer">
        <a class="open">
            <div class="circleAnimation">
                <div class="icon icon-home"></div>
            </div>
            <span>HOME</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-promotion"></div>
            </div>
            <span>PROMOTION</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-balance"></div>
            </div>
            <span>WALLET</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-contact"></div>
            </div>
            <span>LIVE CHAT</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-member"></div>
            </div>
            <span>MEMBER</span>
        </a>
    </footer>
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/16.8.6/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/16.8.6/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.js"></script>
    <script src="js/demo.js"></script>
</body>
</html>
