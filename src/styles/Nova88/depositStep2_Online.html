<!DOCTYPE html>
<html lang="en">
<head>
    <title>NOVA88</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css?v=202003">
    <link rel="stylesheet" href="css/style-dark.css?v=202003">
    <link rel="stylesheet" href="css/font.css?v=202003">
</head>
<body>
    <header class="header">
        <div class="title">Deposit</div>
        <div class="close "><!--class="close open"-->
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="subMenu "></div>
    </header>
    <main class="main">
        <div class="tag">
            <button class="open">Deposit</button>
            <button>Deposit History</button>
        </div>
        <div class="step">
            <div class="stepLine">
                <div class="stepBar50"></div>
            </div>
            <div class="circle">
                <div>
                    <div class="icon icon-checkmark"></div>
                </div>
            </div>
            <div class="circle">
                <div>
                    <div class="icon icon-checkmark"></div>
                </div>
            </div>
            <div class="circle">
                <div>
                    <div>3</div>
                </div>
            </div>
        </div>
        <div class="depositType">
            <div>
                <a class="icon icon-H2P"></a>
                <span>Help2Pay</span>
            </div>
            <div>
                <a class="icon icon-CPP"></a>
                <span>CirclePay</span>
            </div>
            <div>
                <a class="icon icon-OCP"></a>
                <span>OneClickPay</span>
            </div>
            <div>
                <a class="icon icon-EZP"></a>
                <span>Eeziepay</span>
            </div>
            <div>
                <a class="icon icon-VNP"></a>
                <span>VNPay</span>
            </div>
        </div>
        <div class="btn-group">
            <button class="white">Back</button>
        </div>
    </main>
    <footer id="footer">
        <a class="open">
            <div class="circleAnimation">
                <div class="icon icon-home"></div>
            </div>
            <span>HOME</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-promotion"></div>
            </div>
            <span>PROMOTION</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-balance"></div>
            </div>
            <span>WALLET</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-contact"></div>
            </div>
            <span>LIVE CHAT</span>
        </a>
        <a class="">
            <div class="circleAnimation">
                <div class="icon icon-member"></div>
            </div>
            <span>MEMBER</span>
        </a>
    </footer>
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/16.8.6/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/16.8.6/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.js"></script>
</body>
</html>
